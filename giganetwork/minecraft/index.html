<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloxCraft - Mini Voxel Game</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; }
  #info {
    position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5);
    padding: 10px; border-radius: 5px; font-size: 14px; z-index: 1;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #crosshair:before, #crosshair:after {
    content: ''; position: absolute; background: white;
  }
  #crosshair:before { left: 9px; top: 0; width: 2px; height: 20px; }
  #crosshair:after { top: 9px; left: 0; width: 20px; height: 2px; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">
  <b>BloxCraft</b><br>
  WASD: Move | Mouse: Look | Click: Break | Shift+Click: Place<br>
  Click to lock mouse
</div>
<div id="crosshair"></div>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// 1. Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 20, 200);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 10, 0);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 2. Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const directional = new THREE.DirectionalLight(0xffffff, 0.8);
directional.position.set(10, 20, 10);
scene.add(directional);

// 3. Controls
const controls = new PointerLockControls(camera, document.body);
document.addEventListener('click', () => { if(!controls.isLocked) controls.lock(); });

// 4. World data structure
const CHUNK_SIZE = 16;
const blocks = new Map(); // key: "x,y,z" -> block type
const blockMeshes = new Map();

function getKey(x,y,z) { return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`; }

const materials = {
  grass: new THREE.MeshLambertMaterial({color: 0x228B22}),
  dirt: new THREE.MeshLambertMaterial({color: 0x8B4513}),
  stone: new THREE.MeshLambertMaterial({color: 0x808080})
};

function addBlock(x,y,z,type='grass') {
  const key = getKey(x,y,z);
  if(blocks.has(key)) return;
  blocks.set(key, type);

  const geometry = new THREE.BoxGeometry(1,1,1);
  const mesh = new THREE.Mesh(geometry, materials[type]);
  mesh.position.set(Math.floor(x)+0.5, Math.floor(y)+0.5, Math.floor(z)+0.5);
  mesh.userData.key = key;
  scene.add(mesh);
  blockMeshes.set(key, mesh);
}

function removeBlock(x,y,z) {
  const key = getKey(x,y,z);
  if(!blocks.has(key)) return;
  blocks.delete(key);
  const mesh = blockMeshes.get(key);
  if(mesh) scene.remove(mesh);
  blockMeshes.delete(key);
}

// 5. Generate terrain
for(let x=-CHUNK_SIZE; x<CHUNK_SIZE; x++) {
  for(let z=-CHUNK_SIZE; z<CHUNK_SIZE; z++) {
    const height = 3 + Math.floor(Math.sin(x*0.2) * 1 + Math.cos(z*0.2) * 1);
    for(let y=0; y<height; y++) {
      if(y === height-1) addBlock(x, y, z, 'grass');
      else if(y > height-3) addBlock(x, y, z, 'dirt');
      else addBlock(x, y, z, 'stone');
    }
  }
}

// 6. Input handling
const keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(0,0);

document.addEventListener('mousedown', (e) => {
  if(!controls.isLocked) return;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(Array.from(blockMeshes.values()));
  if(intersects.length > 0) {
    const hit = intersects[0];
    const pos = hit.point.clone().add(hit.face.normal.multiplyScalar(-0.1));
    const x = Math.floor(pos.x);
    const y = Math.floor(pos.y);
    const z = Math.floor(pos.z);
    if(e.shiftKey) {
      const placePos = hit.point.clone().add(hit.face.normal.multiplyScalar(0.1));
      addBlock(placePos.x, placePos.y, placePos.z, 'dirt');
    } else {
      removeBlock(x, y, z);
    }
  }
});

// 7. Movement and game loop
let moveSpeed = 0.15;
function animate() {
  requestAnimationFrame(animate);

  if(controls.isLocked) {
    if(keys['KeyW']) controls.moveForward(moveSpeed);
    if(keys['KeyS']) controls.moveForward(-moveSpeed);
    if(keys['KeyA']) controls.moveRight(-moveSpeed);
    if(keys['KeyD']) controls.moveRight(moveSpeed);
    if(keys['Space']) camera.position.y += moveSpeed;
    if(keys['ShiftLeft']) camera.position.y -= moveSpeed;
  }

  renderer.render(scene, camera);
}
animate();

// 8. Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
