```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 600px;
            height: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #222;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.4;
        }

        .user {
            align-self: flex-end;
            background: #222;
            color: white;
        }

        .bot {
            align-self: flex-start;
            background: #e9e9e9;
            color: #222;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        Simple Chatbot
    </div>

    <div class="chat" id="chat">
        <div class="message bot">
            Hello! Type a command to get started.
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Type something..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">Send</button>
    </div>

</div>


<script>

    // =========================================================
    // EDIT YOUR COMMANDS HERE
    // =========================================================

    const commands = [

        {
            input: "hello",
            output: "Hello! Nice to meet you."
        },

        {
            input: "hi",
            output: "Hi! How are you?"
        },

        {
            input: "what is your name",
            output: "I am a simple predefined chatbot."
        },

        {
            input: "help",
            output: "Available commands: hello, hi, what is your name, help"
        },

        {
            input: "bye",
            output: "Goodbye!"
        }

        // Add more commands below:
        //
        // {
        //     input: "your command",
        //     output: "Your response"
        // },

    ];


    // =========================================================
    // CHATBOT CODE
    // You normally do not need to edit anything below this.
    // =========================================================

    function sendMessage() {

        const input = document.getElementById("userInput");
        const text = input.value.trim();

        if (text === "") {
            return;
        }

        addMessage(text, "user");

        input.value = "";

        const response = findResponse(text);

        setTimeout(() => {
            addMessage(response, "bot");
        }, 300);
    }


    function findResponse(userText) {

        const cleanedText = userText.toLowerCase();

        for (const command of commands) {

            if (cleanedText === command.input.toLowerCase()) {
                return command.output;
            }

        }

        return "I don't understand that command.";
    }


    function addMessage(text, sender) {

        const chat = document.getElementById("chat");

        const message = document.createElement("div");

        message.classList.add("message", sender);

        message.textContent = text;

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;
    }


    // Allow pressing Enter instead of clicking Send

    document.getElementById("userInput").addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

</script>

</body>
</html>
